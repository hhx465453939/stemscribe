name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: contract (docs + CHG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CHG three-piece must exist and not be draft
        run: |
          set -euo pipefail
          fail=0
          for f in tasks/CHG-0001/SPEC.md tasks/CHG-0001/PRD.md tasks/CHG-0001/TRACEABILITY.md; do
            if [ ! -s "$f" ]; then echo "::error missing or empty: $f"; fail=1; fi
          done
          if grep -qiE '^\| *status *\| *\*\*?draft' tasks/CHG-0001/SPEC.md; then
            echo "::error CHG-0001 is still draft"; fail=1
          fi
          [ "$fail" -eq 0 ] && echo "CHG contract OK"
      - name: Required docs present
        run: |
          set -euo pipefail
          for f in docs/ARCHITECTURE.md docs/PIPELINE.md docs/MODEL-REGISTRY.md \
                   docs/RESOURCE-SCHEDULER.md docs/LLM-PROVIDERS.md docs/UI-DESIGN.md \
                   docs/DECISIONS.md docs/ROADMAP.md docs/UPSTREAM-RESEARCH.md; do
            [ -s "$f" ] || { echo "::error missing or empty: $f"; exit 1; }
          done
      - name: JSON schemas parse
        run: |
          set -euo pipefail
          for f in docs/schema/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1],encoding='utf-8'))" "$f"
            echo "ok $f"
          done
      - name: Redaction scan (no real hosts, paths or credentials)
        run: bash scripts/redact-scan.sh

  go:
    name: go (build + vet + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          # No `cache: true` yet: this module has zero external dependencies, so
          # there is no go.sum for the action to key on and it warns on every run.
          # Re-enable when the first real dependency lands (CHG-0002).
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test ./... -race -count=1
      - name: Coverage (resource + provider)
        run: |
          go test ./internal/resource/... -coverprofile=cover-resource.out
          go test ./internal/provider/... -coverprofile=cover-provider.out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: cover-*.out
          if-no-files-found: ignore

  web:
    name: web (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin the same pnpm major as local development. pnpm 9 treats a
      # pnpm-workspace.yaml without a `packages:` field as a hard error and does
      # not understand `allowBuilds`, so version skew fails the install step.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          # pnpm 11.15.1 declares engines.node >= 22.13; Node 20 makes pnpm die at
          # startup with ERR_UNKNOWN_BUILTIN_MODULE before install even begins.
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: pnpm run lint
      - name: Typecheck
        working-directory: frontend
        run: pnpm run typecheck
      - name: Build (static export)
        working-directory: frontend
        run: pnpm run build
      - name: Verify static export output
        run: |
          set -euo pipefail
          test -f frontend/out/index.html || { echo "::error frontend/out/index.html missing"; exit 1; }
          for p in library models settings; do
            test -f "frontend/out/$p/index.html" || { echo "::error frontend/out/$p/index.html missing"; exit 1; }
          done
