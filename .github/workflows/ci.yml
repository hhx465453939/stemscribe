name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: contract (docs + CHG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CHG three-piece must exist and not be draft
        run: |
          set -euo pipefail
          fail=0
          for f in tasks/CHG-0001/SPEC.md tasks/CHG-0001/PRD.md tasks/CHG-0001/TRACEABILITY.md; do
            if [ ! -s "$f" ]; then echo "::error missing or empty: $f"; fail=1; fi
          done
          if grep -qiE '^\| *status *\| *\*\*?draft' tasks/CHG-0001/SPEC.md; then
            echo "::error CHG-0001 is still draft"; fail=1
          fi
          [ "$fail" -eq 0 ] && echo "CHG contract OK"
      - name: Required docs present
        run: |
          set -euo pipefail
          for f in docs/ARCHITECTURE.md docs/PIPELINE.md docs/MODEL-REGISTRY.md \
                   docs/RESOURCE-SCHEDULER.md docs/LLM-PROVIDERS.md docs/UI-DESIGN.md \
                   docs/DECISIONS.md docs/ROADMAP.md; do
            [ -s "$f" ] || { echo "::error missing or empty: $f"; exit 1; }
          done
      - name: JSON schemas parse
        run: |
          for f in docs/schema/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
            echo "ok $f"
          done

  go:
    name: go (build + vet + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -race -count=1
      - name: Coverage (resource + provider)
        run: |
          go test ./internal/resource/... -coverprofile=cover-resource.out
          go test ./internal/provider/... -coverprofile=cover-provider.out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: cover-*.out
          if-no-files-found: ignore

  web:
    name: web (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Skip when the frontend does not exist yet
        id: check
        run: |
          if [ -f frontend/package.json ]; then echo "present=yes" >> "$GITHUB_OUTPUT"; else echo "present=no" >> "$GITHUB_OUTPUT"; fi
      - name: Install
        if: steps.check.outputs.present == 'yes'
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        if: steps.check.outputs.present == 'yes'
        working-directory: frontend
        run: pnpm lint
      - name: Build (static export)
        if: steps.check.outputs.present == 'yes'
        working-directory: frontend
        run: pnpm build
      - name: Verify static export output
        if: steps.check.outputs.present == 'yes'
        run: test -f frontend/out/index.html || { echo "::error frontend/out/index.html missing"; exit 1; }
