name: runtime

# Builds whisper.cpp ourselves instead of trusting a stranger's binary (ADR-013).
#
# Three backends per the owner decision: vulkan for AMD/Intel/integrated GPUs
# (self-contained archive), cpu as the always-works fallback, cuda12 for the
# NVIDIA ceiling.
#
# Emits registry-values.json with the measured size + sha256: a measured value is
# the only sanctioned way this registry gets a checksum.
#
# cuda12 is a separate, opt-in job. It cannot live in the main matrix because
# `matrix` is not available in a job-level `if` (that made the whole workflow fail
# to parse, producing zero jobs), and the hosted image carries no CUDA toolkit.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach assets to (empty = build only)'
        required: false
        default: ''
      with_cuda:
        description: 'Also build cuda12 (needs a CUDA-capable runner)'
        type: boolean
        default: false
  push:
    tags: ['runtime-v*']

permissions:
  contents: write

env:
  WHISPER_VERSION: 'v1.9.5'

jobs:
  build:
    name: build ${{ matrix.backend }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cpu
            cmake_flags: '-DGGML_CUDA=OFF -DGGML_VULKAN=OFF'
          - backend: vulkan
            cmake_flags: '-DGGML_CUDA=OFF -DGGML_VULKAN=ON'
    steps:
      # Our own repo first: the staging script lives in .github/scripts and the
      # whisper.cpp checkout below replaces the workspace, not adds to it.
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout whisper.cpp at a pinned tag
        uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: ${{ env.WHISPER_VERSION }}
          path: src
          submodules: recursive

      - name: Install Vulkan SDK
        if: matrix.backend == 'vulkan'
        shell: pwsh
        run: |
          # choco rather than the dedicated action: that action reported success
          # while CMake still could not find_package(Vulkan).
          choco install vulkan-sdk -y --no-progress
          if (-not $env:VULKAN_SDK) {
            $env:VULKAN_SDK = (Get-ChildItem 'C:\VulkanSDK' -Directory | Select-Object -Last 1).FullName
          }
          "VULKAN_SDK=$env:VULKAN_SDK" | Out-File -Append $env:GITHUB_ENV
          Write-Host "Vulkan SDK: $env:VULKAN_SDK"

      - name: Enter MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        working-directory: src
        run: |
          # Ninja instead of the Visual Studio generator: the generator must
          # discover an installed instance and failed on the hosted image.
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=OFF `
            -DWHISPER_BUILD_TESTS=OFF `
            -DWHISPER_BUILD_SERVER=OFF `
            ${{ matrix.cmake_flags }}

      - name: Build whisper-cli
        working-directory: src
        run: cmake --build build -j 4

      - name: Stage and measure
        shell: pwsh
        run: ./.github/scripts/stage-runtime.ps1 -Backend '${{ matrix.backend }}' -Version '${{ env.WHISPER_VERSION }}'

      - name: Assert no vendor leakage
        shell: pwsh
        run: |
          # A CPU/Vulkan archive carrying CUDA DLLs would break for everyone
          # without an NVIDIA driver (ADR-012 cost note).
          $leak = Get-ChildItem -Recurse -Path stage -Include cudart64*.dll,cublas*.dll -ErrorAction SilentlyContinue
          if ($leak) { throw "CUDA DLLs leaked into the ${{ matrix.backend }} archive" }
          Write-Host 'no CUDA DLLs present'

      - uses: actions/upload-artifact@v4
        with:
          name: whispercpp-${{ matrix.backend }}
          path: dist/*
          if-no-files-found: error

  build-cuda:
    name: build cuda12 (opt-in)
    # Job-level `if` may only use inputs/ref contexts; matrix is not available here.
    if: ${{ inputs.with_cuda }}
    runs-on: windows-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout whisper.cpp at a pinned tag
        uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: ${{ env.WHISPER_VERSION }}
          path: src
          submodules: recursive

      - name: Locate CUDA toolkit
        shell: pwsh
        run: |
          $root = 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA'
          $dir = Get-ChildItem $root -Directory -ErrorAction SilentlyContinue |
                 Sort-Object Name -Descending | Select-Object -First 1
          if (-not $dir) {
            throw "cuda12 needs a CUDA toolkit; none under $root. Run on a CUDA-capable runner."
          }
          "CUDA_PATH=$($dir.FullName)" | Out-File -Append $env:GITHUB_ENV
          "$($dir.FullName)\bin" | Out-File -Append $env:GITHUB_PATH
          nvcc --version

      - name: Enter MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        working-directory: src
        run: |
          # -allow-unsupported-compiler is nvcc's supported escape hatch when the
          # host MSVC is newer than the toolkit advertises.
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=OFF `
            -DWHISPER_BUILD_TESTS=OFF `
            -DWHISPER_BUILD_SERVER=OFF `
            -DGGML_CUDA=ON -DGGML_VULKAN=OFF `
            -DCMAKE_CUDA_FLAGS=-allow-unsupported-compiler

      - name: Build whisper-cli
        working-directory: src
        run: cmake --build build -j 4

      - name: Stage and measure
        shell: pwsh
        run: ./.github/scripts/stage-runtime.ps1 -Backend 'cuda12' -Version '${{ env.WHISPER_VERSION }}'

      - uses: actions/upload-artifact@v4
        with:
          name: whispercpp-cuda12
          path: dist/*
          if-no-files-found: error

  registry-values:
    name: emit measured registry values
    needs: [build, build-cuda]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Merge measured values
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, glob, pathlib
          out = {}
          for p in sorted(glob.glob('artifacts/*.json')):
              out[pathlib.Path(p).stem] = json.load(open(p))
          pathlib.Path('registry-values.json').write_text(json.dumps(out, indent=2))
          print(json.dumps(out, indent=2))
          PY
          # Paste into internal/registry/data/registry.json: size + sha256, drop tbd.
      - uses: actions/upload-artifact@v4
        with:
          name: registry-values
          path: registry-values.json

  publish:
    name: attach assets to release
    needs: [build, registry-values]
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: |
          cd assets
          sha256sum *.zip > SHA256SUMS.txt || true
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            assets/*.zip
            assets/SHA256SUMS.txt
            assets/registry-values.json
          fail_on_unmatched_files: false
