name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.0.1-rc1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          # Must match ci.yml and local development: pnpm 9 rejects the
          # allowBuilds policy in frontend/pnpm-workspace.yaml.
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          # pnpm 11.15.1 requires node >= 22.13 (see engines in pnpm's manifest).
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = if ('${{ github.event.inputs.tag }}') { '${{ github.event.inputs.tag }}' } else { '${{ github.ref_name }}' }
          $ver = $tag.TrimStart('v')
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "tag=$tag version=$ver"

      - name: Frontend static export
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          if (-not (Test-Path out/index.html)) { throw 'frontend/out/index.html missing' }

      - name: Go tests
        run: go test ./... -count=1

      - name: Install MSYS2 toolchain (gcc for cgo)
        # The desktop client embeds WebView2 through cgo, so the release runner needs
        # a C compiler. path-type inherit puts mingw64/bin on PATH for later steps.
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Embed UI assets
        shell: pwsh
        run: |
          $assets = 'internal/webui/assets'
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          Get-ChildItem -LiteralPath $assets -Recurse -File |
            Where-Object { $_.Name -ne 'placeholder.txt' } |
            Remove-Item -Force
          Copy-Item -Path 'frontend/out/*' -Destination $assets -Recurse -Force
          if (-not (Test-Path (Join-Path $assets 'index.html'))) { throw 'UI assets not embedded' }

      - name: Build binary
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $env:CGO_ENABLED = '0'
          # stemscribe-cli.exe, not stemscribe.exe: Windows is case-insensitive, so
          # stemscribe.exe and Stemscribe.exe are the same path and the desktop build
          # would overwrite the CLI (a release once shipped a single exe because of it).
          go build -trimpath -ldflags "-s -w -X main.version=$v" -o dist/stemscribe-cli.exe ./cmd/stemscribe
          if (-not (Test-Path dist/stemscribe-cli.exe)) { throw 'cli binary missing' }

      - name: Build desktop client
        shell: pwsh
        run: |
          # This is the thing a user double-clicks: a native WebView2 window, no
          # browser, no address bar. Without this step a release would ship only the
          # CLI and the desktop client would simply not exist in the download.
          $v = '${{ steps.ver.outputs.version }}'
          $env:CGO_ENABLED = '1'
          go build -trimpath -tags 'gui desktop production' `
            -ldflags "-H windowsgui -s -w -X main.version=$v" `
            -o dist/Stemscribe.exe ./cmd/stemscribe-gui
          if (-not (Test-Path dist/Stemscribe.exe)) { throw 'desktop client missing' }
          Write-Host ("desktop client: {0} MB" -f ([math]::Round((Get-Item dist/Stemscribe.exe).Length/1MB,2)))

      - name: Assemble portable zip
        shell: pwsh
        run: |
          $tag = '${{ steps.ver.outputs.tag }}'
          $stage = "stage/Stemscribe-$tag"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          # Stemscribe.exe is the client (UI is embedded in it); stemscribe.exe is the
          # CLI kept alongside for automation. No separate ui/ folder is needed now.
          Copy-Item dist/Stemscribe.exe $stage/
          Copy-Item dist/stemscribe-cli.exe $stage/
          Copy-Item README.md, README.zh-CN.md, LICENSE $stage/
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'docs') | Out-Null
          Copy-Item docs/*.md (Join-Path $stage 'docs')
          @"
          Stemscribe $tag

          Stemscribe.exe   double-click this: native window client (UI embedded)
          stemscribe-cli.exe   CLI for automation (run / probe / runtime install / model install)

          First launch creates workdir/ next to the exe and keeps models and runtimes
          inside it. Nothing is written to your user profile.
          "@ | Set-Content (Join-Path $stage 'START-HERE.txt')
          Compress-Archive -Path $stage -DestinationPath "dist/Stemscribe-$tag-portable.zip" -Force
          Get-ChildItem dist | Format-Table Name, Length

      - name: Checksums
        shell: pwsh
        run: |
          Push-Location dist
          $lines = Get-ChildItem -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          $lines | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          Pop-Location

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Stemscribe ${{ steps.ver.outputs.tag }}
          draft: true
          prerelease: ${{ contains(steps.ver.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          body: |
            Windows x64 portable build.

            - **Stemscribe.exe** — double-click this. Native WebView2 window client
              with the UI embedded; no browser, no address bar, no tabs.
            - **stemscribe.exe** — CLI for automation.

            The first launch creates `workdir/` next to the executable and keeps
            models, runtimes and transcripts inside it. Nothing is written to your
            user profile.

            **Not yet included** (tracked in CHG-0002):
            - whisper.cpp / ffmpeg runtimes and models are fetched on demand via
              `stemscribe runtime install` / `stemscribe model install`
            - the CUDA runtime archive (CI has no CUDA-capable runner yet; the
              registry marks it tbd and refuses to install unverified bytes)
            - code signing

            Verify downloads with the attached `SHA256SUMS.txt`.
